services:
  haproxy:
    image: haproxy:latest
    container_name: haproxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VISION_SNI=${VISION_SNI}
      - XHTTP_SNI=${XHTTP_SNI}
      - WS_SNI=${WS_SNI}
      - BASE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ./haproxy/entrypoint.sh:/haproxy-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/haproxy-entrypoint.sh"]
    depends_on:
      - caddy
      - xray
      - naive

  caddy:
    image: ghcr.io/0xf00f00/caddy-proxy:latest
    container_name: caddy
    restart: unless-stopped
    environment:
      - CERTIFICATE_EMAIL=${CERTIFICATE_EMAIL}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - PROXY_USER=${HTTPS_PROXY_USER}
      - PROXY_PASSWORD=${HTTPS_PROXY_PASSWORD}
    entrypoint: ["/bin/sh", "/caddy-entrypoint.sh"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/caddy-entrypoint.sh:ro
    depends_on:
      - decoy
      - naive
      - xray

  # Sing-box naive INBOUND. Egress -> warp-lb SOCKS (load-balanced kernel WARP).
  naive:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: naive
    restart: unless-stopped
    environment:
      - PROXY_USER=${HTTPS_PROXY_USER}
      - PROXY_PASSWORD=${HTTPS_PROXY_PASSWORD}
      - WARP_EGRESS=${WARP_EGRESS:-true}
    volumes:
      - ./naive/entrypoint.sh:/entrypoint.sh:ro
      - ./warp/lib.sh:/wg-lib.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - warp-lb

  # Xray INBOUND
  xray:
    image: teddysun/xray:latest
    container_name: xray
    restart: unless-stopped
    ports:
      - "${XRAY_VISION_HOST_PORT:-8443}:8443"
      - "${XRAY_XHTTP_HOST_PORT:-8444}:8444"
      - "${XRAY_WS_HOST_PORT:-8445}:8445"
    environment:
      - XRAY_UUID=${XRAY_UUID}
      - XRAY_PATH=${XRAY_PATH}
      - WARP_EGRESS=${WARP_EGRESS:-true}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - VISION_SNI=${VISION_SNI}
    volumes:
      - ./xray/entrypoint.sh:/entrypoint.sh:ro
      - ./warp/lib.sh:/wg-lib.sh:ro
      # Read-only access to Caddy's ACME store
      - caddy_data:/caddy-data:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - warp-lb

  decoy:
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: decoy
    restart: unless-stopped

  # Optional: creates the SNI DNS records in Cloudflare for you (CF_DNS_MANAGE=true).
  # Existing records are left untouched unless CF_DNS_FORCE=true. Runs once and exits.
  cf-dns:
    image: alpine:latest
    container_name: cf-dns
    restart: "no"
    environment:
      - CF_DNS_MANAGE=${CF_DNS_MANAGE:-false}
      - CF_DNS_FORCE=${CF_DNS_FORCE:-false}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - VISION_SNI=${VISION_SNI}
      - XHTTP_SNI=${XHTTP_SNI}
      - WS_SNI=${WS_SNI}
      - NAIVE_SNI=${NAIVE_SNI}
    volumes:
      - ./cf-dns/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  # One-shot: register N WARP accounts -> warp1..N.conf (Table=off) in warp_confs.
  warp-reg:
    image: virb3/wgcf:latest
    container_name: warp-reg
    restart: "no"
    environment:
      - WARP_EGRESS=${WARP_EGRESS:-true}
      - WARP_LICENSE_KEY=${WARP_LICENSE_KEY:-}
      - WARP_ACCOUNTS=${WARP_ACCOUNTS:-4}
      # Distinct WARP edge per tunnel (avoids per-source-IP throttling). Comma- or
      # space-separated; blank falls back to the default WARP endpoint domain.
      - WARP_ENDPOINTS=${WARP_ENDPOINTS:-}
      # Set to true (once) to discard existing profiles and re-register fresh.
      - WARP_FORCE_REGEN=${WARP_FORCE_REGEN:-false}
    volumes:
      - warp_confs:/confs
      - ./warp/lib.sh:/wg-lib.sh:ro
      - ./warp/register.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  # Warp tunnels
  warp-wg:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: warp-wg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - warp_confs:/config/wg_confs
      - /lib/modules:/lib/modules:ro
    depends_on:
      warp-reg:
        condition: service_completed_successfully

  # load balancer outbound for WARP
  warp-lb:
    image: teddysun/xray:latest
    container_name: warp-lb
    restart: unless-stopped
    network_mode: "service:warp-wg"
    environment:
      - WARP_ACCOUNTS=${WARP_ACCOUNTS:-4}
    volumes:
      - ./warp/gateway.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - warp-wg

volumes:
  caddy_data:
  caddy_config:
  warp_confs:
