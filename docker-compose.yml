services:
  caddy:
    image: ghcr.io/0xf00f00/caddy-proxy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CERTIFICATE_EMAIL=${CERTIFICATE_EMAIL}
      - WEB_DOMAINS=${WEB_DOMAINS}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - PROXY_USER=${HTTPS_PROXY_USER}
      - PROXY_PASSWORD=${HTTPS_PROXY_PASSWORD}
      - PROXY_REJECT_IPS=${HTTPS_PROXY_REJECT_IPS}
      - PROXY_REJECT_DOMAINS=${HTTPS_PROXY_REJECT_DOMAINS}
      - XRAY_PATH=${XRAY_PATH}
    entrypoint: ["/bin/sh", "/caddy-entrypoint.sh"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/caddy-entrypoint.sh:ro
    depends_on:
      - decoy
      - naive
      - xray

  # Sing-box naive INBOUND
  naive:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: naive
    restart: unless-stopped
    environment:
      - PROXY_USER=${HTTPS_PROXY_USER}
      - PROXY_PASSWORD=${HTTPS_PROXY_PASSWORD}
      - WARP_EGRESS=${WARP_EGRESS:-true}
    volumes:
      - ./naive/entrypoint.sh:/entrypoint.sh:ro
      - ./warp/lib.sh:/wg-lib.sh:ro
      - warp_profile:/warp:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      warp-reg:
        condition: service_completed_successfully

  # Xray INBOUND (VLESS over ws + xhttp)
  xray:
    image: teddysun/xray:latest
    container_name: xray
    restart: unless-stopped
    environment:
      - XRAY_UUID=${XRAY_UUID}
      - XRAY_PATH=${XRAY_PATH}
      - WARP_EGRESS=${WARP_EGRESS:-true}
    volumes:
      - ./xray/entrypoint.sh:/entrypoint.sh:ro
      - ./warp/lib.sh:/wg-lib.sh:ro
      - warp_profile:/warp:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      warp-reg:
        condition: service_completed_successfully

  decoy:
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: decoy
    restart: unless-stopped

  # One-shot wgcf registration -> writes wgcf-profile.conf to the shared volume
  warp-reg:
    image: virb3/wgcf:latest
    container_name: warp-reg
    restart: "no"
    environment:
      - WARP_EGRESS=${WARP_EGRESS:-true}
      - WARP_LICENSE_KEY=${WARP_LICENSE_KEY:-}
    volumes:
      - warp_profile:/profile
      - ./warp/lib.sh:/wg-lib.sh:ro
      - ./warp/register.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

volumes:
  caddy_data:
  caddy_config:
  warp_profile: