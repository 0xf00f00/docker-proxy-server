services:
  haproxy-config:
    image: alpine:latest
    container_name: haproxy-config
    restart: "no"
    entrypoint: [ "/bin/sh", "-c", "/root/haproxy/update_config.sh" ]
    volumes:
      - ./haproxy:/root/haproxy:ro
      - haproxy_data:/root/haproxy_data
    environment:
      - WEB_DOMAINS=${WEB_DOMAINS}
  haproxy:
    image: haproxy:latest
    container_name: haproxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - haproxy_data:/usr/local/etc/haproxy:ro
    depends_on:
      - haproxy-config
      - caddy
  caddy:
    image: ghcr.io/0xf00f00/caddy-proxy:latest
    container_name: caddy
    restart: unless-stopped
    environment:
      - CERTIFICATE_EMAIL=${CERTIFICATE_EMAIL}
      - DOMAINS=${WEB_DOMAINS}
      - PROXY_USER=${HTTPS_PROXY_USER}
      - PROXY_PASSWORD=${HTTPS_PROXY_PASSWORD}
      - PROXY_REJECT_IPS=${HTTPS_PROXY_REJECT_IPS}
      - PROXY_REJECT_DOMAINS=${HTTPS_PROXY_REJECT_DOMAINS}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - mozilla_mdn
  mozilla_mdn:
    image: ghcr.io/0xf00f00/mdn:latest
    container_name: mozilla_mdn
    restart: unless-stopped

  dnstt-server:
    image: ghcr.io/0xf00f00/dnstt-server:latest
    container_name: dnstt-server
    restart: unless-stopped
    profiles:
      - dnstt
    ports:
      - "${DNSTT_PORT:-5300}:5300/udp"
    volumes:
      - dnstt-keys:/etc/dnstt
    environment:
      - DNSTT_DOMAIN=${DNSTT_DOMAIN}
      - DNSTT_FORWARD_ADDR=dnstt-multiplexer:4444
      - DNSTT_MTU=1232
    depends_on:
      - dnstt-multiplexer

  dnstt-multiplexer:
    image: ghcr.io/yrutschle/sslh:latest
    container_name: dnstt-multiplexer
    restart: unless-stopped
    profiles:
      - dnstt
    # -p listens on 4444. Route ssh to dnstt-ssh:22, socks5 to dnstt-socks:1080.
    # --anyprot routes everything else to ssh to maintain backward compatibility
    command: ["-f", "-p", "0.0.0.0:4444", "--ssh", "dnstt-ssh:22", "--socks5", "dnstt-socks:1080", "--anyprot", "dnstt-ssh:22"]
    depends_on:
      - dnstt-ssh
      - dnstt-socks

  dnstt-socks:
    image: serjs/go-socks5-proxy:latest
    container_name: dnstt-socks
    restart: unless-stopped
    profiles:
      - dnstt
    environment:
      - PROXY_USER=${DNSTT_SSH_USER:-tunnel}
      - PROXY_PASSWORD=${DNSTT_SSH_PASSWORD}

  dnstt-ssh:
    image: linuxserver/openssh-server
    container_name: dnstt-ssh
    restart: unless-stopped
    profiles:
      - dnstt
    environment:
      - DOCKER_MODS=linuxserver/mods:openssh-server-ssh-tunnel
      - SHELL_NOLOGIN=false
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=true
      - LISTEN_PORT=22
      - USER_NAME=${DNSTT_SSH_USER:-tunnel}
      - USER_PASSWORD=${DNSTT_SSH_PASSWORD}
      - PUBLIC_KEY=${DNSTT_SSH_PUBLIC_KEY}

volumes:
  haproxy_data:
  dnstt-keys: